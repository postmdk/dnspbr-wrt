name: Build and Release OpenWrt dnspbr-wrt

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- OpenWrt 23.05.6 ---
          - distro: "23.05.6"
            target: ramips/mt7621
            name: mipsel_24kc_mt7621_23.05.6
            sdk_url: "https://downloads.openwrt.org/releases/23.05.6/targets/ramips/mt7621/openwrt-sdk-23.05.6-ramips-mt7621_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
          - distro: "23.05.6"
            target: ramips/mt76x8
            name: mipsel_24kc_mt76x8_23.05.6
            sdk_url: "https://downloads.openwrt.org/releases/23.05.6/targets/ramips/mt76x8/openwrt-sdk-23.05.6-ramips-mt76x8_gcc-12.3.0_musl.Linux-x86_64.tar.xz"

          # --- OpenWrt 24.10.8 ---
          - distro: "24.10.8"
            target: mediatek/filogic
            name: aarch64_cortex-a53_24.10.8
            sdk_url: "https://downloads.openwrt.org/releases/24.10.8/targets/mediatek/filogic/openwrt-sdk-24.10.8-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          - distro: "24.10.8"
            target: ramips/mt7621
            name: mipsel_24kc_mt7621_24.10.8
            sdk_url: "https://downloads.openwrt.org/releases/24.10.8/targets/ramips/mt7621/openwrt-sdk-24.10.8-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          - distro: "24.10.8"
            target: ramips/mt76x8
            name: mipsel_24kc_mt76x8_24.10.8
            sdk_url: "https://downloads.openwrt.org/releases/24.10.8/targets/ramips/mt76x8/openwrt-sdk-24.10.8-ramips-mt76x8_gcc-13.3.0_musl.Linux-x86_64.tar.zst"

          # --- OpenWrt 25.12.6 ---
          - distro: "25.12.6"
            target: mediatek/filogic
            name: aarch64_cortex-a53_25.12.6
            sdk_url: "https://downloads.openwrt.org/releases/25.12.6/targets/mediatek/filogic/openwrt-sdk-25.12.6-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          - distro: "25.12.6"
            target: ramips/mt7621
            name: mipsel_24kc_mt7621_25.12.6
            sdk_url: "https://downloads.openwrt.org/releases/25.12.6/targets/ramips/mt7621/openwrt-sdk-25.12.6-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          - distro: "25.12.6"
            target: ramips/mt76x8
            name: mipsel_24kc_mt76x8_25.12.6
            sdk_url: "https://downloads.openwrt.org/releases/25.12.6/targets/ramips/mt76x8/openwrt-sdk-25.12.6-ramips-mt76x8_gcc-14.3.0_musl.Linux-x86_64.tar.zst"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev gawk git libssl-dev zlib1g-dev libelf-dev wget unzip python3 zstd

      - name: Download and Extract OpenWrt SDK
        run: |
          echo "Downloading SDK for ${{ matrix.name }}..."
          wget -q "${{ matrix.sdk_url }}" -O sdk.tar

          echo "Extracting SDK..."
          tar -xf sdk.tar
          rm -f sdk.tar

          mv openwrt-sdk-* openwrt-sdk

          cd openwrt-sdk
          # Подключаем весь репозиторий целиком как локальный фид
          echo "src-link dnspbr_feed /home/runner/work/$(basename $GITHUB_REPOSITORY)/$(basename $GITHUB_REPOSITORY)" >> feeds.conf.default
          ./scripts/feeds update -a

          # Устанавливаем все фиды
          ./scripts/feeds install -a

      - name: Compile packages
        run: |
          cd openwrt-sdk
          export TERM=xterm-256color
          make defconfig

          # Собираем все пакеты последовательно
          make package/dnspbr/compile V=s
          make package/luci-app-dnspbr/compile V=s

      - name: Prepare Artifacts Directory
        run: |
          mkdir -p compiled-packages

          # Собираем все собранные пакетики (.ipk / .apk) в одну папку для релиза
          find openwrt-sdk/bin/packages/ -name "*dnspbr*.ipk" -o -name "*dnspbr*.apk" | while read -r f; do
            filename=$(basename "$f")
            name_without_ext="${filename%.*}"
            ext="${filename##*.}"
            cp "$f" "compiled-packages/${name_without_ext}-${{ matrix.name }}.${ext}"
          done

      - name: Upload Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: dnspbr-packages-${{ matrix.name }}-${{ matrix.distro }}
          path: compiled-packages/*

      - name: Publish Release (on Git Tag)
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: compiled-packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
